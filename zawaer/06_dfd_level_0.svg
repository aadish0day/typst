ess&#187;</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="18.0718" x="629.81" y="277.6308">0.0</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="145.9199" x="629.81" y="292.5796">ZAWER Central System</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="193.6353" x="629.81" y="307.5283">(Luxury Jewellery E-Commerce</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="156.7363" x="629.81" y="322.477">&amp; Vault Logistics Engine)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="217.4707" x="629.81" y="337.4257">[zawer_backend : Express/Node.js]</text></g><!--entity PaymentGateway--><g class="entity" data-qualified-name="PaymentGateway" data-source-line="27" id="ent0003"><rect fill="#FDFDFD" height="79.7949" rx="2.5" ry="2.5" style="stroke:#212121;stroke-width:2.5;" width="249.709" x="612.69" y="48.6982"/><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="105.4854" x="684.8018" y="70.8921">&#171;External Entity&#187;</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="111.2744" x="622.69" y="85.8408">Payment Gateway</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="229.709" x="622.69" y="100.7896">(Banking Gateway / UPI / Card / COD)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="182.0508" x="622.69" y="115.7383">[Payment Settlement Partner]</text></g><!--entity LogisticsPartner--><g class="entity" data-qualified-name="LogisticsPartner" data-source-line="29" id="ent0004"><rect fill="#FDFDFD" height="79.7949" rx="2.5" ry="2.5" style="stroke:#212121;stroke-width:2.5;" width="231.6499" x="621.72" y="475.1882"/><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="105.4854" x="684.8023" y="497.3821">&#171;External Entity&#187;</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="106.1963" x="631.72" y="512.3308">Logistics Partner</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="205.8862" x="631.72" y="527.2796">(Sequel Secure Luxury Logistics)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="211.6499" x="631.72" y="542.2283">[Armored Transit &amp; GPS Tracking]</text></g><!--link Customer to System--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk5"><path d="M155.9,335.7082 C180.46,359.8482 215.12,388.2782 252.45,401.3382 C270.65,407.7082 581.19,407.5082 599.45,401.3382 C630.38,390.8982 656.0423,373.767 679.8323,353.647" fill="none" id="Customer-to-System" style="stroke:#212121;stroke-width:2;"/><polygon fill="#212121" points="683.65,350.4182,674.1951,353.1759,679.8323,353.647,679.3611,359.2842,683.65,350.4182" style="stroke:#212121;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="139.3208" x="356.7737" y="309.6561">[Inbound Customer Flows]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="345.9683" x="253.45" y="322.305">1. User Registration &amp; Auth Credentials (Email, Phone, Pass, OTP)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="292.8105" x="280.0289" y="334.954">2. Search Queries, Category Filters &amp; Diamond Inquiries</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="287.8745" x="282.4969" y="347.6029">3. Cart Items, Quantity Adjustments &amp; Wishlist Toggles</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="289.7275" x="281.5704" y="360.2518">4. Privilege Coupon Codes (ROYAL20, SOLITAIRE5000)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="308.1289" x="272.3697" y="372.9007">5. Order Placement, Delivery Address &amp; Payment Selection</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="258.543" x="297.1626" y="385.5497">6. Consignment Tracking Queries (ZWR-XXXXXX)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="221.8745" x="315.4969" y="398.1986">7. Product Ratings &amp; Authenticity Reviews</text></g><!--reverse link Customer to System--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="34" id="lnk7"><path d="M237.36,295.3382 C346.94,295.3382 507.7,295.3382 619.39,295.3382" fill="none" id="Customer-backto-System" style="stroke:#212121;stroke-width:2;"/><polygon fill="#212121" points="232.36,295.3382,241.36,299.3382,237.36,295.3382,241.36,291.3382,232.36,295.3382" style="stroke:#212121;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="163.7969" x="344.501" y="200.6561">[Outbound System Responses]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="283.019" x="284.8899" y="213.305">1. JWT Bearer Tokens, Auth Responses &amp; Profile Data</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="350.8989" x="250.95" y="225.954">2. Luxury Jewellery Catalog, BIS Hallmark Specs &amp; High-Res Media</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="201.0884" x="325.8553" y="238.6029">3. Synchronized Cart &amp; Wishlist Totals</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="336.1768" x="258.3111" y="251.2518">4. Validated Discount Amounts &amp; Privilege Promotional Banners</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="288.519" x="282.1399" y="263.9007">5. Order Placement Confirmation &amp; Digital Tax Invoices</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="331.9229" x="260.438" y="276.5497">6. Real-Time Vault Milestone Progression &amp; AI Delivery Insights</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="307.4844" x="272.6573" y="289.1986">7. Published Review Feedback &amp; Verified Collector Badges</text></g><!--reverse link PaymentGateway to System--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="37" id="lnk9"><path d="M607.7447,120.0777 C588.5447,129.8577 575.6,140.7582 563.55,158.4882 C550.56,177.6082 551.23,190.9382 563.55,210.4882 C576.92,231.7282 597.33,247.7082 619.55,259.6882" fill="none" id="PaymentGateway-backto-System" style="stroke:#212121;stroke-width:2;"/><polygon fill="#212121" points="612.2,117.8082,602.3649,118.329,607.7447,120.0777,605.996,125.4574,612.2,117.8082" style="stroke:#212121;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="99.6338" x="664.1784" y="169.8061">[Payment Request]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="298.8906" x="564.55" y="182.455">1. Transaction Initiation (Order ID, Net Payable Valuation)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="205.9707" x="611.01" y="195.104">2. Customer Contact &amp; Billing Metadata</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="252.4307" x="587.78" y="207.7529">3. Selected Payment Method (Online / COD Flag)</text></g><!--link PaymentGateway to System--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="39" id="lnk10"><path d="M840.74,128.8582 C851.77,137.0482 861.51,146.8282 868.55,158.4882 C880.49,178.2782 879.61,190.1982 868.55,210.4882 C862.51,221.5782 857.968,228.0203 848.598,236.7003" fill="none" id="PaymentGateway-to-System" style="stroke:#212121;stroke-width:2;"/><polygon fill="#212121" points="844.93,240.0982,854.2507,236.9164,848.598,236.7003,848.8141,231.0476,844.93,240.0982" style="stroke:#212121;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="108.8076" x="971.6807" y="169.8061">[Payment Response]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="295.8291" x="878.17" y="182.455">1. Transaction Authorization Token &amp; Reference Number</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="289.126" x="881.5216" y="195.104">2. Real-Time Settlement Confirmation / Failure Callback</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="282.396" x="884.8866" y="207.7529">3. Payment Audit Timestamp &amp; Reconciliation Receipt</text></g><!--link System to LogisticsPartner--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="42" id="lnk11"><path d="M619.63,325.1482 C592.44,337.5282 566.79,355.1482 550.55,380.1882 C534.82,404.4182 534.02,421.4882 550.55,445.1882 C567.47,469.4482 589.2471,483.4628 617.0171,493.6728" fill="none" id="System-to-LogisticsPartner" style="stroke:#212121;stroke-width:2;"/><polygon fill="#212121" points="621.71,495.3982,614.6432,488.5382,617.0171,493.6728,611.8825,496.0468,621.71,495.3982" style="stroke:#212121;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="101.4546" x="663.1184" y="391.5061">[Dispatch Manifest]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="204.1445" x="611.7734" y="404.155">1. Armored Transit Consignment Order</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="285.4629" x="571.1142" y="416.804">2. Encrypted Delivery Waybill &amp; Customer Geolocation</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="324.5913" x="551.55" y="429.4529">3. High-Value Insurance Declaration &amp; Tamper-Evident Seal ID</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="252.4468" x="587.6223" y="442.1018">4. Dispatch Priority &amp; Armed Escort Instructions</text></g><!--reverse link System to LogisticsPartner--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="44" id="lnk13"><path d="M860.4686,353.727 C870.2686,362.377 875.11,368.9482 881.55,380.1882 C895.91,405.2482 896.95,420.7382 881.55,445.1882 C874.16,456.9082 864.16,466.6782 852.86,474.8182" fill="none" id="System-backto-LogisticsPartner" style="stroke:#212121;stroke-width:2;"/><polygon fill="#212121" points="856.72,350.4182,860.8205,359.3729,860.4686,353.727,866.1145,353.3751,856.72,350.4182" style="stroke:#212121;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="109.4146" x="997.3023" y="391.5061">[Logistics Feedback]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="316.5991" x="893.71" y="404.155">1. Secure Waybill Number &amp; Consignment ID (ZWR-XXXXXX)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="288.5352" x="907.742" y="416.804">2. Real-Time Vault Milestone Scans (6 Tracking Stages)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="276.3105" x="913.8543" y="429.4529">3. Armored Vehicle GPS Geofence &amp; Proximity Pings</text><text fill="#000000" font-family="'Liberation Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="311.7329" x="896.1431" y="442.1018">4. Final Delivery Seal Inspection &amp; Proof of Handover (POD)</text></g><?plantuml-src ZLRzRnev4FsTlsAKaz8K1PgarrwlgYeHFXggV52WoLsRgZAxm-B6QrElDuJ-zVViPHT2qlQI208UUzwyzsQysOtKSs55IfbRAiQhbP7BKrNBgfM9Y6uIQt8TjuqoblxeXP-DY9Yd
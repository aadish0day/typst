<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1161px" preserveAspectRatio="none" style="width:1324px;height:1161px;background:#FFFFFF;" version="1.1" viewBox="0 0 1324 1161" width="1324px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="21"><text fill="#000000" font-family="'Liberation Sans'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="748.0859" x="287.3599" y="40.6357">FactStamp - Module 5: Weighted Consensus &amp; Confidence Architecture</text></g><ellipse cx="663.5444" cy="71.2979" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="429.1992" x="448.9448" y="101.2979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="409.1992" x="458.9448" y="124.4297">Quorum Reached in Module 4 (N &gt;= 3 Verifications Recorded)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="348.7471" x="489.1709" y="157.3965"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="328.7471" x="499.1709" y="180.5283">Ingest Verification Vector: V = { v_1, v_2, ..., v_N }</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="1288.8057" x="16" y="213.4951"/><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="339.6826" x="98.7896" y="263.6431"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="319.6826" x="108.7896" y="286.7749">Component 1: Agreement Ratio (A, 40% Weight)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="481.2617" x="28" y="334.7417"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="461.2617" x="38" y="357.8735">Tally Verdict Counts: { TRUE, FALSE, MISLEADING, UNVERIFIABLE }</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="345.6025" x="95.8296" y="405.8403"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="325.6025" x="105.8296" y="428.9722">Resolve Majority Verdict: V_maj = argmax(count)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="372.7891" x="82.2363" y="476.939"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="352.7891" x="92.2363" y="500.0708">Compute Agreement Ratio: A = (max_count / N) * 100</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="225.0098" x="156.126" y="548.0376"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="205.0098" x="166.126" y="571.1694">Weighted Score A_w = 0.40 * A</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="352.9033" x="537.2617" y="299.1924"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="332.9033" x="547.2617" y="322.3242">Component 2: Verifier Reputation (R, 30% Weight)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="337.4063" x="545.0103" y="370.291"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="317.4063" x="555.0103" y="393.4229">Fetch Snapshot Reputations: { r_1, r_2, ..., r_N }</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="339.2998" x="544.0635" y="441.3896"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="319.2998" x="554.0635" y="464.5215">Compute Mean Reputation: R = (1 / N) * sum(r_i)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="225.0098" x="601.2085" y="512.4883"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="205.0098" x="611.2085" y="535.6201">Weighted Score R_w = 0.30 * R</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="380.9238" x="911.8818" y="239.4951"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="360.9238" x="921.8818" y="262.627">Component 3: Source Domain Quality (S, 30% Weight)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="347.5439" x="928.5718" y="310.5938"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="327.5439" x="938.5718" y="333.7256">Parse Domain Hostnames from Evidentiary URLs</text><rect fill="#F8F8F8" height="84.3945" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="288.0098" x="958.3389" y="381.6924"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="136.1172" x="968.3389" y="404.8242">Map Authority Tiers:</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="268.0098" x="968.3389" y="420.9229">- Tier 1 (Govt / WHO / Gazette): S_i = 100</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="240.8232" x="968.3389" y="437.0215">- Tier 2 (Established Press): S_i = 70</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="239.2305" x="968.3389" y="453.1201">- Tier 3 (Blogs / Unverified): S_i = 30</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="358.0234" x="923.332" y="501.0869"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="338.0234" x="933.332" y="524.2188">Compute Mean Source Score: S = (1 / N) * sum(s_i)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="223.4648" x="990.6113" y="572.1855"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="203.4648" x="1000.6113" y="595.3174">Weighted Score S_w = 0.30 * S</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="1288.8057" x="16" y="628.2842"/><rect fill="#F8F8F8" height="52.1973" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="256.4619" x="535.3135" y="654.2842"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="236.4619" x="545.3135" y="677.416">Composite Confidence Calculation:</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="224.4512" x="545.3135" y="693.5146">C_raw = round(A_w + R_w + S_w)</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="347.9063" x="489.5913" y="726.4814"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="327.9063" x="499.5913" y="749.6133">Boundary Clamping: C = min(100, max(0, C_raw))</text><rect fill="#F8F8F8" height="100.4932" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="250.2617" x="538.4136" y="782.5801"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="230.2617" x="548.4136" y="805.7119">Update Firestore Claim Document:</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="161.8887" x="548.4136" y="821.8105">- claim.status = 'verified'</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="151.3545" x="548.4136" y="837.9092">- claim.verdict = V_maj</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="187.1201" x="548.4136" y="854.0078">- claim.confidenceScore = C</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="198.7891" x="548.4136" y="870.1064">- claim.verifiedAt = timestamp</text><rect fill="#F8F8F8" height="84.3945" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="464.2266" x="431.4312" y="903.0732"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="271.4824" x="441.4312" y="926.2051">Execute Reputation Settlement Protocol:</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="314.3643" x="441.4312" y="942.3037">- If verifier verdict matches V_maj: delta_R = +2</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="345.8438" x="441.4312" y="958.4023">- If verifier verdict dissents from V_maj: delta_R = -1</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="444.2266" x="441.4312" y="974.501">- Clamp updated score: R_new = min(100, max(0, R_old + delta_R))</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="398.8477" x="464.1206" y="1007.4678"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="378.8477" x="474.1206" y="1030.5996">Dispatch Real-Time Notifications to Submitter &amp; Verifiers</text><rect fill="#F8F8F8" height="36.0986" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="476.6748" x="425.207" y="1063.5664"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="456.6748" x="435.207" y="1086.6982">Unlock Module 6 High-Fidelity Fact Card Generator (1080x1080 PNG)</text><ellipse cx="663.5444" cy="1130.665" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="663.5444" cy="1130.665" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:2;" x1="663.5444" x2="663.5444" y1="81.2979" y2="101.2979"/><polygon fill="#000000" points="659.5444,91.2979,667.5444,91.2979,663.5444,101.2979" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="663.5444" x2="663.5444" y1="137.3965" y2="157.3965"/><polygon fill="#000000" points="659.5444,147.3965,667.5444,147.3965,663.5444,157.3965" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="268.6309" x2="268.6309" y1="299.7417" y2="334.7417"/><polygon fill="#000000" points="264.6309,324.7417,272.6309,324.7417,268.6309,334.7417" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="268.6309" x2="268.6309" y1="370.8403" y2="405.8403"/><polygon fill="#000000" points="264.6309,395.8403,272.6309,395.8403,268.6309,405.8403" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="268.6309" x2="268.6309" y1="441.939" y2="476.939"/><polygon fill="#000000" points="264.6309,466.939,272.6309,466.939,268.6309,476.939" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="268.6309" x2="268.6309" y1="513.0376" y2="548.0376"/><polygon fill="#000000" points="264.6309,538.0376,272.6309,538.0376,268.6309,548.0376" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="713.7134" x2="713.7134" y1="335.291" y2="370.291"/><polygon fill="#000000" points="709.7134,360.291,717.7134,360.291,713.7134,370.291" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="713.7134" x2="713.7134" y1="406.3896" y2="441.3896"/><polygon fill="#000000" points="709.7134,431.3896,717.7134,431.3896,713.7134,441.3896" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="713.7134" x2="713.7134" y1="477.4883" y2="512.4883"/><polygon fill="#000000" points="709.7134,502.4883,717.7134,502.4883,713.7134,512.4883" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="1102.3438" x2="1102.3438" y1="275.5938" y2="310.5938"/><polygon fill="#000000" points="1098.3438,300.5938,1106.3438,300.5938,1102.3438,310.5938" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:2;" x1="1102.3438" x2="1102.3438" y1="346.6924" y2="381.6924"/><polygon fill="#000000" points="1098.3438,371.6924,1106.3438,371.6924,1102.3438,381
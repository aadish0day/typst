<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="808px" preserveAspectRatio="none" style="width:1212px;height:808px;background:#FFFFFF;" version="1.1" viewBox="0 0 1212 808" width="1212px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="header" data-source-line="34"><text fill="#888888" font-family="'Liberation Sans'" font-size="10" lengthAdjust="spacing" textLength="117.5586" x="1087.4414" y="9.3799">-[hidden]down-&gt; ClaimBox</text></g><g class="title" data-source-line="16"><text fill="#000000" font-family="'Liberation Sans'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="766.6162" x="219.1919" y="43.1348">FactStamp - Shareable Fact-Check Card Layout Wireframe (1080x1080px)</text></g><!--cluster Card--><g class="cluster" data-qualified-name="Card" data-source-line="18" id="ent0001"><rect fill="#F8F8F8" height="728.58" style="stroke:#000000;stroke-width:2;" width="1191" x="7" y="65.7969"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="445.7236" x="379.6382" y="80.9287">Fact-Check Card Root Container (Aspect Ratio 1:1, Saffron Border)</text></g><!--entity Header--><g class="entity" data-qualified-name="Card.Header" data-source-line="19" id="ent0002"><rect fill="#F8F8F8" height="36.0986" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="624.543" x="22.73" y="116.8969"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="604.543" x="32.73" y="140.0287">Header Band: [SHIELD ICON] FACTSTAMP VERIFIED  |  CASE #C_SEED_12  |  04 SEP 2026</text></g><!--entity ClaimBox--><g class="entity" data-qualified-name="Card.ClaimBox" data-source-line="21" id="ent0003"><rect fill="#F8F8F8" height="68.2959" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="499.6299" x="682.19" y="100.7969"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="420.8682" x="692.19" y="123.9287">Claim Under Review Container (Warm Tinted Surface #F6F1EA)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="479.6299" x="692.19" y="140.0273">\"Drinking boiled ginger water with lemon twice daily permanently cures</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="397.1885" x="692.19" y="156.126">Type 2 Diabetes within 14 days... [Forwarded Many Times]\"</text></g><!--entity VerdictStamp--><g class="entity" data-qualified-name="Card.VerdictStamp" data-source-line="23" id="ent0004"><rect fill="#F8F8F8" height="68.2959" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="425.2891" x="699.36" y="229.0969"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="345.7686" x="709.36" y="252.2287">Signature Rubber-Stamp Verdict Badge (~6 deg Tilt)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="146.2207" x="709.36" y="268.3273">[ X ] VERDICT: FALSE</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="405.2891" x="709.36" y="284.426">(Crimson Double-Encoded Border #DC2626, Chromatic Halo)</text></g><!--entity Metrics--><g class="entity" data-qualified-name="Card.Metrics" data-source-line="25" id="ent0005"><rect fill="#F8F8F8" height="68.2959" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="577.498" x="604.25" y="357.3869"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="238.8066" x="614.25" y="380.5187">Confidence &amp; Quorum Metric Matrix</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="557.498" x="614.25" y="396.6173">CONFIDENCE SCORE: 94% [===================----] (3 / 3 Independent Verifiers)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="524.4189" x="614.25" y="412.716">Agreement Ratio: 100%  |  Avg Verifier Rep: 82  |  Source Authority: Tier 1 (100)</text></g><!--entity Summary--><g class="entity" data-qualified-name="Card.Summary" data-source-line="27" id="ent0006"><rect fill="#F8F8F8" height="84.3945" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="537.7881" x="624.11" y="485.6869"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="222.5234" x="634.11" y="508.8187">Consensus Evidentiary Summary</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="517.7881" x="634.11" y="524.9173">\"No clinical or peer-reviewed evidence demonstrates that boiled ginger water</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="497.1299" x="634.11" y="541.016">reverses pancreatic beta-cell degradation. The Ministry of Health and WHO</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="391.6924" x="634.11" y="557.1146">caution against discontinuing prescribed insulin therapy.\"</text></g><!--entity Sources--><g class="entity" data-qualified-name="Card.Sources" data-source-line="29" id="ent0007"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="460.2549" x="662.87" y="630.0769"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="257.5029" x="672.87" y="653.2087">Authoritative Primary Source Citations</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="440.2549" x="672.87" y="669.3073">[who.int/diabetes]   [mohfw.gov.in/alerts]   [icmr.gov.in/guidelines]</text></g><!--entity Footer--><g class="entity" data-qualified-name="Card.Footer" data-source-line="31" id="ent0008"><rect fill="#F8F8F8" height="36.0986" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="455.6543" x="665.17" y="742.2769"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="435.6543" x="675.17" y="765.4087">Footer Zone: Verify Viral Forwards at https://factstamp.vercel.app</text></g><!--link ClaimBox to VerdictStamp--><!--link VerdictStamp to Metrics--><!--link Metrics to Summary--><!--link Summary to Sources--><!--link Sources to Footer--><?plantuml-src TLHjR-8u4FxEhnXHxQcL5WfiLNMHxYGQ4XMfRqUuzdI0LYOnYTN4Zcm7chsx_Utxv8KkNLW-sC4puvbvdcTiNeJCc6Of6Lia7AiMWStJf6NUBAcIAeYrIZbPdVCzIyZNB4-ifwIzPp2tRyMAQsQ5akGpQTh7VNtnbLF_uXV6gewLIi8zknKsuM-XWy5Hqu_0FVEA1I-HLhaC7PKeJTjOsFqMfZomJ4O9lrOwvBfsMYM8-hNJB1R1Y-J6qA3RE-hsKz8Jxyhxx8sEkHx7uxrvhx6gM_9OW5EMPjGXFsQQirLpsd5Y7hoGmtH8jwnGkQLdeVbQb_ISzdjNlTTooLxFMYszIqBjdqEdIbboa9i9oJMTZam6PvgMr59_sFy8UjTh3PfhHCxQn4mT-c-BQE_c6yvWfsicmo7D_Pk9UpkcYVDmloHlvCpysUZkaPxSwSIRk6EY_uYSaU_IYVF5Tztnb_wWEkjTaEy-qg0tkAmorRSYq_jaJi94Id_9CkEKRmJVxZVnp7HACo4j3ydFzPe57CnSUdrtTBQGY_PO2ma68a0j4lX4-4RSbjbo5JQcX6CMo6u58aCcae8ohbCckRJu3dBDpKBEYWmIfR5WAswvgIA51By8AKotswMvf_GMM2777PC5QagvMIxQDOXb3zVgzQ0vNqIIMUIWQRx2c7Lg1Jnn7M9aWN0OWU9lbnYc25Sc5atDwMzQbl2E9yvi2CHlVNSXJnqjKeDEnYg7S3gk35HPJCqbdOoTmUNWyYCvvT23ye1kMA9gZfjqLUv3_9LSYv1BmFCR_PahdQTqnyid1OrYUrr8CEzDnkwzuvBlF4pT8Ns--43ptmz_7VoMTFg9pkaJJS1fnh58MvOWre9hWmP7aUOyBKyhRGwft-jzg2GpsaHldX13DgIhMak-oZKA7EKsLbhOOWYmuD8lnwDNDrdNR8xrPxWqkI5tK_Pf1TC5j9Ics4i9tIiA4Y55m1B2t6SSDEbAY82NRnfimb96U6bPAGyRCtjCSGk9G3G9bup903DU4W59iKx0awHaMREmUckxD8
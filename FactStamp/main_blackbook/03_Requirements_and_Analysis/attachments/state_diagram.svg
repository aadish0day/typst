<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:849px;height:954px;background:#FFFFFF;" width="849px" height="954px" viewBox="0 0 849 954" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="33"><text x="148.737" y="34.388" fill="#000" font-size="26" textLength="544.718" font-weight="700" font-family="'Liberation Sans'">FactStamp - State Diagram (Claim Lifecycle)</text></g><g class="entity" data-qualified-name="Pending" id="ent0001" data-source-line="44"><rect x="147.36" y="212.897" width="349.757" height="156.838" fill="#F8F8F8" style="stroke:#000;stroke-width:2.5;" rx="12.5" ry="12.5"/><line x1="147.36" y1="242.446" x2="497.117" y2="242.446" style="stroke:#000;stroke-width:2.5;"/><text x="289.189" y="233.843" fill="#000" font-size="17" textLength="66.099" font-weight="700" font-family="'Liberation Sans'">pending</text><text x="152.36" y="263.392" fill="#000" font-size="17" textLength="143.628" font-weight="700" font-family="'Liberation Sans'">status = 'pending'</text><text x="152.36" y="282.94" fill="#000" font-size="17" textLength="168.614" font-weight="700" font-family="'Liberation Sans'">verificationCount &lt; 3</text><text x="152.36" y="302.488" fill="#000" font-size="17" textLength="329.757" font-weight="700" font-family="'Liberation Sans'">consensusDeadline = createdAt + 7 days</text><text x="152.36" y="322.037" fill="#000" font-size="17" textLength="304.647" font-weight="700" font-family="'Liberation Sans'">verdict = provisional running majority</text><text x="152.36" y="341.585" fill="#000" font-size="17" textLength="11.322" font-weight="700" font-family="'Liberation Sans'">--</text><text x="152.36" y="361.133" fill="#000" font-size="17" textLength="212.566" font-weight="700" font-family="'Liberation Sans'">visible in the /verify queu
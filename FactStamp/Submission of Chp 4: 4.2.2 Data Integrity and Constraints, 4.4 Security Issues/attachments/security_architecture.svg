<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="718px" preserveAspectRatio="none" style="width:2340px;height:718px;background:#FFFFFF;" version="1.1" viewBox="0 0 2340 718" width="2340px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="21"><text fill="#000000" font-family="'Liberation Sans'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="673.5566" x="829.7217" y="30.6357">FactStamp - Defense-in-Depth Security &amp; Anti-Sybil Architecture</text></g><!--cluster L1--><g class="cluster" data-qualified-name="L1" data-source-line="23" id="ent0001"><rect fill="#F8F8F8" height="284.4" style="stroke:#000000;stroke-width:2;" width="997" x="259" y="53.2979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="238.8408" x="638.0796" y="68.4297">Layer 1: Client &amp; Transport Security</text></g><!--cluster L2--><g class="cluster" data-qualified-name="L2" data-source-line="30" id="ent0006"><rect fill="#F8F8F8" height="302.39" style="stroke:#000000;stroke-width:2;" width="863" x="1296" y="218.4979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="322.8135" x="1566.0933" y="233.6297">Layer 2: Identity &amp; Cryptographic Authentication</text></g><!--cluster L3--><g class="cluster" data-qualified-name="L3" data-source-line="36" id="ent0010"><rect fill="#F8F8F8" height="302.39" style="stroke:#000000;stroke-width:2;" width="1200" x="7" y="401.6979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="364.1709" x="424.9146" y="416.8297">Layer 3: Declarative Database Security (firestore.rules)</text></g><!--cluster L4--><g class="cluster" data-qualified-name="L4" data-source-line="44" id="ent0016"><rect fill="#F8F8F8" height="119.2" style="stroke:#000000;stroke-width:2;" width="1079" x="1247" y="584.8879"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="381.2402" x="1595.8799" y="600.0197">Layer 4: Game-Theoretic Incentive &amp; Consensus Security</text></g><!--entity L1A--><g class="entity" data-qualified-name="L1.L1A" data-source-line="24" id="ent0002"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="305.4688" x="345.27" y="96.2979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="178.1582" x="355.27" y="119.4297">TLS 1.3 Transport Security</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="285.4688" x="355.27" y="135.5283">Strict HTTPS origin binding, HSTS headers</text></g><!--entity L1B--><g class="entity" data-qualified-name="L1.L1B" data-source-line="25" id="ent0003"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="527.165" x="685.42" y="96.2979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="220.917" x="695.42" y="119.4297">Input Sanitization &amp; XSS Defense</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="507.165" x="695.42" y="135.5283">Regex tag stripping, protocol neutralization (javascript:), JSX auto-encoding</text></g><!--entity L1C--><g class="entity" data-qualified-name="L1.L1C" data-source-line="26" id="ent0004"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="475.123" x="283.44" y="261.4979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="205.3652" x="293.44" y="284.6297">Triple-Layer Upload Inspection</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="455.123" x="293.44" y="300.7283">Extension whitelist, MIME type verification, Binary Magic Byte check</text></g><!--entity L1D--><g class="entity" data-qualified-name="L1.L1D" data-source-line="27" id="ent0005"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="430.7373" x="793.63" y="261.4979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="220.124" x="803.63" y="284.6297">Session &amp; Brute-Force Throttling</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="410.7373" x="803.63" y="300.7283">30-minute idle session timeout, 5-attempt exponential lockout</text></g><!--entity L2A--><g class="entity" data-qualified-name="L2.L2A" data-source-line="31" id="ent0007"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="366.9512" x="1339.52" y="261.4979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="268.4063" x="1349.52" y="284.6297">Google Identity Services / Firebase Auth</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="346.9512" x="1349.52" y="300.7283">OIDC Identity Federation &amp; Email/Password hashing</text></g><!--entity L2B--><g class="entity" data-qualified-name="L2.L2B" data-source-line="32" id="ent0008"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="393.4473" x="1741.28" y="261.4979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="213.1924" x="1751.28" y="284.6297">RS256 Asymmetric JWT Tokens</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="373.4473" x="1751.28" y="300.7283">Short-lived signed user claims &amp; secure refresh rotation</text></g><!--entity L2C--><g class="entity" data-qualified-name="L2.L2C" data-source-line="33" id="ent0009"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="422.1992" x="1339.9" y="444.6979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="237.2617" x="1349.9" y="467.8297">Role-Based Access Control (RBAC)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="402.1992" x="1349.9" y="483.9283">Standard Citizen vs. Authenticated Verifier vs. Administrator</text></g><!--entity L3A--><g class="entity" data-qualified-name="L3.L3A" data-source-line="37" id="ent0011"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="447.082" x="31.46" y="444.6979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="160.2549" x="41.46" y="467.8297">Core Claim Immutability</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="427.082" x="41.46" y="483.9283">identityUnchanged(): text, category, submitter, deadlines locked</text></g><!--entity L3B--><g class="entity" data-qualified-name="L3.L3B" data-source-line="38" id="ent0012"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="273.9893" x="514.01" y="444.6979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="197.6064" x="524.01" y="467.8297">Self-Verification Lock (P_self)</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="253.9893" x="524.01" y="483.9283">claim.submittedBy != request.auth.uid</text></g><!--entity L3C--><g class="entity" data-qualified-name="L3.L3C" data-source-line="39" id="ent0013"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="340.5781" x="822.71" y="444.6979"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="202.2754" x="832.71" y="467.8297">Single-Vote-Per-User Invariant</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="320.5781" x="832.71" y="483.9283">Duplicate votes by same verifier strictly blocked</text></g><!--entity L3D--><g class="entity" data-qualified-name="L3.L3D" data-source-line="40" id="ent0014"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="411.3027" x="49.35" y="627.8879"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="170.3311" x="59.35" y="651.0197">Trust Attribute Protection</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="391.3027" x="59.35" y="667.1183">Users cannot elevate own reputation or grant admin status</text></g><!--entity L3E--><g class="entity" data-qualified-name="L3.L3E" data-source-line="41" id="ent0015"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="442.1055" x="495.95" y="627.8879"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="173.4756" x="505.95" y="651.0197">Payload Boundary Ceiling</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="422.1055" x="505.95" y="667.1183">Enforces string size bounds (&lt;700KB image, &lt;=2000 chars text)</text></g><!--entity L4A--><g class="entity" data-qualified-name="L4.L4A" data-source-line="45" id="ent0017"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="505.9121" x="1271.04" y="627.8879"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="212.3379" x="1281.04" y="651.0197">Weighted Consensus Algorithm</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="485.9121" x="1281.04" y="667.1183">Confidence C = 0.40*A + 0.30*R + 0.30*S (Suppresses Sybil sockpuppets)</text></g><!--entity L4B--><g class="entity" data-qualified-name="L4.L4B" data-source-line="46" id="ent0018"><rect fill="#F8F8F8" height="52.1973" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:2;" width="470.8438" x="1811.58" y="627.8879"/><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="182.8135" x="1821.58" y="651.0197">Dynamic Reputation Settler</text><text fill="#000000" font-family="'Liberation Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="450.8438" x="1821.58" y="667.1183">+2 alignment reward, -1 dissent penalty, [0, 100] boundary clamping</text></g><!--link L1 to L2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" data-link-type="dependency" data-source-line="49" id="lnk19"><path d="M1256.0643,146.8979 C1256.1414,147.1225 1256.2189,147.3484 1256.2968,147.5755 C1256.6085,148.4838 1256.9269,149.4114 1257.2514,150.3571 C1262.4441,165.4882 1269.2281,185.2572 1276.0113,205.0241 C1282.7944,224.791 1289.5766,244.5557 1294.7655,259.678 C1295.0898,260.6232 1295.4079,261.5502 1295.7193,262.4579 C1295.7972,262.6848 1294.2519,258.1812 1294.3289,258.4057" fill="none" id="L1-to
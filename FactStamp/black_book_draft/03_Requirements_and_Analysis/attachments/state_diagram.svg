</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="212.5664" x="210.34" y="361.1333">visible in the /verify queue</text></g><g class="entity" data-qualified-name="Verified" data-source-line="53" id="ent0002"><rect fill="#F8F8F8" height="176.3867" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2.5;" width="343.9795" x="208.23" y="524.7375"/><line style="stroke:#000000;stroke-width:2.5;" x1="208.23" x2="552.2095" y1="554.2858" y2="554.2858"/><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="60.4712" x="349.9842" y="545.6833">verified</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="138.0005" x="213.23" y="575.2316">status = 'verified'</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="272.5562" x="213.23" y="594.7799">verifiedAt = settlement timestamp</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="323.9795" x="213.23" y="614.3283">verdict in { TRUE, FALSE, MISLEADING,</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="251.2397" x="213.23" y="633.8766">UNVERIFIABLE, CONTESTED }</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="168.6387" x="213.23" y="653.425">confidenceScore = C</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="11.3223" x="213.23" y="672.9733">--</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="234.3228" x="213.23" y="692.5216">fact-check card is exportable</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="63" id="ent0003"><ellipse cx="380.22" cy="66.8975" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="73" id="ent0009"><ellipse cx="206.22" cy="837.6175" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="206.22" cy="837.6175" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" data-source-line="76" id="ent0012"><path d="M361.45,798.1275 L361.45,877.1216 L747.0008,877.1216 L747.0008,808.1275 L737.0008,798.1275 L361.45,798.1275" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M737.0008,798.1275 L737.0008,808.1275 L747.0008,808.1275 L737.0008,798.1275" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="20" lengthAdjust="spacing" textLength="319.0234" x="367.45" y="821.8872">ClaimStatus has exactly two values:</text><text fill="#000000" font-family="'Liberation Sans'" font-size="20" lengthAdjust="spacing" textLength="160.0195" x="367.45" y="844.8853">CONTESTED is a</text><text fill="#000000" font-family="'Liberation Sans'" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="65.5859" x="533.0262" y="844.8853">verdict</text><text fill="#000000" font-family="'Liberation Sans'" font-size="20" lengthAdjust="spacing" textLength="133.3887" x="598.6121" y="844.8853">, not a status --</text><text fill="#000000" font-family="'Liberation Sans'" font-size="20" lengthAdjust="spacing" textLength="359.4434" x="367.45" y="867.8833">an expired claim is still status = 'verified'.</text></g><!--link *start* to Pending--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="dependency" data-source-line="63" id="lnk4"><path d="M380.22,77.1675 C380.22,100.1475 380.22,156.5575 380.22,207.5975" fill="none" id="
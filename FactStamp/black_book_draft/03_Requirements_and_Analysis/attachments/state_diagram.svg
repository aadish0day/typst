tion Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="210.6406" x="622.3666" y="297.8599">AND deadline not passed]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="172.8555" x="641.2592" y="317.4083">/ append Verification;</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="253.1738" x="601.1" y="336.9566">recompute provisional majority</text></g><!--link Pending to Verified--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="67" id="lnk6"><path d="M205.22,325.1175 C130.09,343.0875 54.41,367.8275 32.22,397.7375 C6,433.0775 6.46,461.0675 32.22,496.7375 C72.84,552.9675 137.0849,581.0869 203.0649,596.1169" fill="none" id="Pending-to-Verified" style="stroke:#000000;stroke-width:2.5;"/><polygon fill="#000000" points="207.94,597.2275,200.0532,591.3284,203.0649,596.1169,198.2764,599.1286,207.94,597.2275" style="stroke:#000000;stroke-width:2.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="134.124" x="114.2688" y="424.1833">addVerification()</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="234.2813" x="64.1902" y="443.7316">[verificationCount reaches 3]</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="216.833" x="72.9143" y="463.2799">/ verdict = majority verdict;</text><text fill="#000000" font-family="'Liberation Sans'" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="296.2217" x="33.22" y="482.8283">C = (A x 0.40) + (R x 0.30) + (S x 0.30)</text></g><!--link Pending to Verified--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data
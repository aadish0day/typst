 y="759.6018">&#8226; Notification Service (80% &amp; 100% threshold alerts)</text></g><!--entity C4--><g class="entity" data-qualified-name="L4.C4" data-source-line="29" id="ent0008"><rect fill="#FFFFFF" height="87.7206" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="376.8374" x="72.58" y="909.9959"/><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="351.9174" x="82.58" y="929.031">&#8226; AppDatabase &amp; Generated DAOs (database.dart)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="350.7474" x="82.58" y="949.4612">&#8226; Schema v5 (payee column &amp; schema migrations)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="356.8374" x="82.58" y="969.8913">&#8226; JSON Exporter/Importer &amp; Quote-Safe CSV Parser</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="183.6162" x="82.58" y="990.3215">&#8226; Stream Query Observers</text></g><!--entity C5--><g class="entity" data-qualified-name="L5.C5" data-source-line="33" id="ent0010"><rect fill="#FFFFFF" height="46.8603" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="395.4976" x="54.25" y="1155.7159"/><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="255.9168" x="64.25" y="1174.751">&#8226; Local SQLite Database File (app.db)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="375.4976" x="64.25" y="1195.1812">&#8226; Android Hardware KeyStore (Biometric Sensor Lock)</text></g><!--link L1 to L2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="36" id="lnk11"><path d="M485,268.6652 C485,272.6706 485,276.723 485,280.8069 C485,288.9746 485,297.2678 485,305.5609 C485,313.8541 485,322.1471 48
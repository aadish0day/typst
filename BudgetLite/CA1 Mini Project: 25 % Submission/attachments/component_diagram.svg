ont-size="15" lengthAdjust="spacing" textLength="286.862" x="86.3" y="114.291">&#8226; App Shell &amp; 6-Tab Navigation (app.dart)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="387.4077" x="86.3" y="134.7212">&#8226; Home Dashboard &amp; Balance Hero (home_screen.dart)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="291.5721" x="86.3" y="155.1513">&#8226; Transactions Ledger &amp; Quick Add Modal</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="303.7671" x="86.3" y="175.5815">&#8226; Monthly Budget Meters &amp; Envelope Setup</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="325.5022" x="86.3" y="196.0116">&#8226; SMS Review Queue &amp; Pending Confirmations</text></g><!--entity C2--><g class="entity" data-qualified-name="L2.C2" data-source-line="21" id="ent0004"><rect fill="#FFFFFF" height="87.7206" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="391.7925" x="92.1" y="346.4059"/><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="347.7174" x="102.1" y="365.441">&#8226; TransactionNotifier (CRUD, transfers, scheduler)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="371.7925" x="102.1" y="385.8712">&#8226; BudgetNotifier (monthly income &amp; threshold alerts)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="362.0725" x="102.1" y="406.3013">&#8226; SettingsNotifier (user preferences &amp; custom rules)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="369.4375" x="102.1" y="426.7315">&#8226; Reactive FutureProviders (thisMonthTxns, budgets)</text></g><!--entity C3--><g class="entity" 
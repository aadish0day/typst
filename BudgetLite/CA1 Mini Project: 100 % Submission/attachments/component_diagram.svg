" width="393.9225" x="79.04" y="95.2559"/><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="318.1972" x="89.04" y="114.291">&#8226; App Shell &amp; Material 3 Navigation (app.dart)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="366.4975" x="89.04" y="134.7212">&#8226; Home Dashboard &amp; Reimbursement Tracker Sheet</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="310.7721" x="89.04" y="155.1513">&#8226; Transactions Ledger &amp; Multi-Category Split</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="332.3273" x="89.04" y="175.5815">&#8226; Monthly Budgets with 80%/100% Alert Meters</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="326.7023" x="89.04" y="196.0116">&#8226; Savings Goals with 'What-If' Simulation Sheet</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="373.9225" x="89.04" y="216.4418">&#8226; Visual Insights (Heatmaps, Calendar &amp; PDF Preview)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="239.9566" x="89.04" y="236.8719">&#8226; Settings &amp; Backup/Restore Panel</text></g><!--entity C2--><g class="entity" data-qualified-name="L2.C2" data-source-line="21" id="ent0004"><rect fill="#FFFFFF" height="108.1507" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="416.3626" x="55.82" y="387.2659"/><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="339.9773" x="65.82" y="406.301">&#8226; TransactionNotifier (CRUD, splits, autoDispose)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="336.7823" x="65.82" y="426.7312">&#8226; BudgetNotifier (limits, alerts &amp; highlight focus)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="327.4971" x="65.82" y="447.1613">&#8226; GoalNotifier (savings goals &amp; simulator state)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="396.3626" x="65.82" y="467.5915">&#8226; Reactive StreamProviders (autoDispose query streams)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="384.0477" x="65.82" y="488.0216">&#8226; SettingsNotifier (biometrics, themes, backup/restore)</text></g><!--entity C3--><g class="entity" data-qualified-name="L3.C3" data-source-line="25" id="ent0006"><rect fill="#FFFFFF" height="128.5809" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="419.9927" x="53" y="638.4159"/><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="383.6576" x="63" y="657.451">&#8226; Reimbursement Engine (Receivables &amp; settled status)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="399.9927" x="63" y="677.8812">&#8226; Insights Analytics Engine (Velocity &amp; quartile heatmaps)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="372.4375" x="63" y="698.3113">&#8226; PDF Report Builder (On-device vector PDF compiler)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="338.9424" x="63" y="718.7415">&#8226; Biometric Security Guard (local_auth auto-lock)</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="310.6971" x="63" y="739.1716">&#8226; On-Demand SMS Ingestion &amp; Payee Parser</text><text fill="#000000" font-family="'Times New Roman'" font-size="15" lengthAdjust="spacing" textLength="36